spring:
  datasource:
    driverClassName: org.h2.Driver
    url: jdbc:h2:mem:ForumAPI
    username: sa
    password:
      jpa:
        database-platform: org.hibernate.dialect.H2Dialect
        datasource-url: jdbc:h2:file:C:/forum;DB_CLOSE_ON_EXIT=FALSE
        show-sql: true
        defer-datasource-initialization: true
        properties:
            hibernate:
              show_sql: true
              format_sql: true

